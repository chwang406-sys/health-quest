<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 화면에서도 비율이 깨지지 않도록 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스트레칭 미션앱</title>
    <!-- Google Fonts: Noto Sans KR (한글 폰트) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap">
    <!-- CSS 파일 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- 앱 제목 섹션 -->
        <header>
            <h1>💪 스트레칭 미션앱</h1>
            <p class="subtitle">공부하다 지칠 때, 가볍게 몸을 깨워보세요!</p>
        </header>

        <!-- 통계 섹션 (완료 횟수 표시) -->
        <section class="counter-box">
            <span class="counter-label">✨ 오늘 내가 해낸 미션!</span>
            <div class="counter-number" id="completed-count">0</div>
        </section>

        <!-- 메인 카드형 디자인 섹션 -->
        <main class="card" id="mission-card">
            <div class="card-body">
                <!-- 처음에 보여줄 기본 안내 문구 -->
                <p id="mission-text" class="default-text">아래 버튼을 눌러 새로운 스트레칭 미션을 확인하세요!</p>
            </div>
        </main>

        <!-- 조작 버튼 섹션 -->
        <div class="button-group">
            <button id="btn-random" class="btn btn-primary">🔄 새 미션 뽑기</button>
            <!-- 완료 버튼은 처음엔 비활성화(disabled) 상태로 둡니다 -->
            <button id="btn-complete" class="btn btn-success" disabled>✅ 미션 완료!</button>
            <!-- 리셋 버튼: 15개 완료 후에만 나타납니다 -->
            <button id="btn-reset" class="btn btn-reset" style="display:none;">🔁 처음부터 다시 하기</button>
        </div>

        <!-- 푸터 (안내문구 포함) -->
        <footer>
            <p class="notice">⚠️ 이 앱은 생활습관 참고용입니다.</p>
        </footer>
    </div>

    <!-- JavaScript 파일 연결 -->
    <script src="script.js"></script>
</body>
</html>
